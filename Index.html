<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerCompass AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #fce7f3);
    color: #25254a;
}

.container {
    max-width: 600px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 5px;
}

.logo {
    font-size: 45px;
}

h1, h2 {
    color: #5145cd;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px #33333310;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 8px;
}

input, select, button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    font-size: 16px;
}

input, select {
    border: 1px solid #d7d7e5;
    background: white;
}

button {
    border: none;
    background: #5145cd;
    color: white;
    font-weight: bold;
    margin-top: 16px;
    cursor: pointer;
}

.small {
    color: #666;
    line-height: 1.6;
}

.skill {
    background: #f4f3ff;
    padding: 13px;
    border-radius: 10px;
    margin: 10px 0;
}

.skill label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-weight: normal;
}

.skill input {
    width: 20px;
    height: 20px;
}

.progress-bg {
    background: #e5e7eb;
    border-radius: 20px;
    height: 15px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #5145cd;
    transition: width 0.3s;
}

footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 10px;
}
</style>
</head>

<body>
<div class="container">

<header>
    <div class="logo">🧭</div>
    <h1>CareerCompass AI</h1>
    <p class="small">Discover your interests. Build your future.</p>
</header>

<div class="card">
    <h2>👤 Student Profile</h2>

    <label for="studentName">Your Name</label>
    <input id="studentName" type="text"
           placeholder="Enter your name">

    <label for="interest">Career Interest</label>
    <select id="interest">
        <option value="ai">Artificial Intelligence</option>
        <option value="data">Data Analysis</option>
        <option value="web">Web Development</option>
        <option value="robotics">Robotics</option>
    </select>

    <label for="level">Current Skill Level</label>
    <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
    </select>

    <button onclick="createRoadmap()">Create My Roadmap →</button>
    <p id="profileMessage"></p>
</div>

<div class="card" id="roadmapCard" style="display:none;">
    <h2 id="welcome">Your Roadmap</h2>
    <p id="description" class="small"></p>

    <h3>🎯 Your Learning Roadmap</h3>
    <div id="roadmap"></div>

    <h3>📊 Your Progress</h3>
    <p id="progressText">0% completed</p>

    <div class="progress-bg">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <button onclick="resetProgress()">Reset Progress</button>
</div>

<footer>
    CareerCompass AI | Learn Today, Grow Tomorrow 💜
</footer>

</div>

<script>
const careerData = {
    ai: {
        title: "AI / Machine Learning 🤖",
        description: "Learn how intelligent computer systems work.",
        skills: [
            "Python Programming",
            "Mathematics and Statistics",
            "Data Analysis",
            "Machine Learning",
            "Build an AI Project"
        ]
    },

    data: {
        title: "Data Analyst 📊",
        description: "Learn to analyse data and find useful insights.",
        skills: [
            "Excel Basics",
            "SQL",
            "Python Basics",
            "Data Visualisation",
            "Build a Data Project"
        ]
    },

    web: {
        title: "Web Developer 🌐",
        description: "Learn to build useful websites.",
        skills: [
            "HTML",
            "CSS",
            "JavaScript",
            "Responsive Design",
            "Build a Website"
        ]
    },

    robotics: {
        title: "Robotics & Automation ⚙️",
        description: "Explore robots, programming and automation.",
        skills: [
            "Python Basics",
            "Mathematics",
            "Basic Electronics",
            "Sensors and Automation",
            "Build a Robotics Project"
        ]
    }
};

let currentCareer = "";
let completedSkills = [];

function createRoadmap() {
    const name = document.getElementById("studentName").value.trim();
    const interest = document.getElementById("interest").value;
    const level = document.getElementById("level").value;

    if (name === "") {
        document.getElementById("profileMessage").textContent =
            "Please enter your name first!";
        return;
    }

    currentCareer = interest;

    const saved = localStorage.getItem("careerProgress_" + currentCareer);
    completedSkills = saved ? JSON.parse(saved) : [];

    const career = careerData[interest];

    document.getElementById("profileMessage").textContent =
        "Your roadmap is ready!";

    document.getElementById("welcome").textContent =
        "Hello, " + name + "! 👋";

    document.getElementById("description").textContent =
        career.title + " | Current level: " + level;

    let html = "";

    career.skills.forEach(function(skill, index) {
        const checked = completedSkills.includes(index) ? "checked" : "";

        html += `
            <div class="skill">
                <label>
                    <input type="checkbox"
                        ${checked}
                        onchange="toggleSkill(${index}, this.checked)">
                    <span>Step ${index + 1}: ${skill}</span>
                </label>
            </div>
        `;
    });

    document.getElementById("roadmap").innerHTML = html;
    document.getElementById("roadmapCard").style.display = "block";

    updateProgress();

    document.getElementById("roadmapCard").scrollIntoView({
        behavior: "smooth"
    });
}

function toggleSkill(index, isChecked) {
    if (isChecked && !completedSkills.includes(index)) {
        completedSkills.push(index);
    }

    if (!isChecked) {
        completedSkills = completedSkills.filter(function(item) {
            return item !== index;
        });
    }

    localStorage.setItem(
        "careerProgress_" + currentCareer,
        JSON.stringify(completedSkills)
    );

    updateProgress();
}

function updateProgress() {
    const total = careerData[currentCareer].skills.length;
    const percent = Math.round((completedSkills.length / total) * 100);

    document.getElementById("progressText").textContent =
        percent + "% completed (" + completedSkills.length +
        " of " + total + " skills)";

    document.getElementById("progressBar").style.width = percent + "%";
}

function resetProgress() {
    completedSkills = [];

    localStorage.removeItem("careerProgress_" + currentCareer);

    createRoadmap();
}
</script>

</body>
</html>
